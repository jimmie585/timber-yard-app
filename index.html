<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Yard — Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F6F0E6; --paper:#FBF7EF; --walnut:#2B1B12; --oak:#9C6B3E; --oak-light:#C99B63; --rust:#B5482C; --rust-pale:#F3E0D8; --line:#E3D6C1; --shadow:0 10px 34px rgba(43,27,18,0.16); }
  *{box-sizing:border-box;} body{margin:0;min-height:100vh;background:var(--cream);color:var(--walnut);font-family:'Inter',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:36px 30px;max-width:360px;width:100%;box-shadow:var(--shadow);}
  .mark{width:48px;height:48px;border-radius:12px;margin:0 auto 16px;background:repeating-linear-gradient(115deg, var(--oak) 0 5px, var(--oak-light) 5px 11px, var(--oak) 11px 16px);}
  h1{font-family:'Fraunces',Georgia,serif;font-size:22px;margin:0 0 4px;text-align:center;}
  p.sub{color:#7C6A58;font-size:13px;text-align:center;margin:0 0 26px;}
  label{font-size:12px;font-weight:600;color:#7C6A58;display:block;margin-bottom:6px;}
  input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--walnut);font-family:inherit;}
  input:focus{outline:none;border-color:var(--oak);box-shadow:0 0 0 3px rgba(156,107,62,0.15);}
  .field{margin-bottom:15px;}
  button{width:100%;border:none;border-radius:9px;padding:12px;font-size:14.5px;font-weight:700;background:var(--walnut);color:var(--paper);cursor:pointer;margin-top:6px;}
  button:hover{background:#4A3626;}
  .err{background:var(--rust-pale);color:var(--rust);font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;display:none;}
  .config-warning{background:var(--rust-pale);color:var(--rust);padding:14px;border-radius:10px;font-size:13px;line-height:1.5;}
</style>
</head>
<body>
<div class="card">
  <div class="mark"></div>
  <h1>Timber Yard</h1>
  <p class="sub">Log in to continue</p>
  <div id="body"></div>
</div>

<!-- ⚠ PASTE YOUR APPS SCRIPT WEB APP URL BELOW (same one used everywhere else) ⚠ -->
<script>const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsZQhhsj6go5hIlQi3NnUaydFvPSk-88RhfVyaqcPB-XYckf-qhb3VOeAEZxOqkp73/exec";</script>
<script>
async function apiPost(action, payload){
  const res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action}, payload)) });
  return res.json();
}

function renderForm(){
  document.getElementById('body').innerHTML = `
    <div class="err" id="err"></div>
    <div class="field"><label>Username</label><input id="u" autocapitalize="off" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="p" type="password" autocomplete="current-password"></div>
    <button id="loginBtn">Log in</button>
  `;
  document.getElementById('loginBtn').onclick = doLogin;
  document.getElementById('p').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
}

async function doLogin(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR')===0){
    document.getElementById('body').innerHTML = `<div class="config-warning">Not connected yet. Paste your Apps Script Web App URL into APPS_SCRIPT_URL near the top of this file.</div>`;
    return;
  }
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const errEl = document.getElementById('err');
  if(!u || !p){ errEl.textContent = 'Enter both username and password'; errEl.style.display='block'; return; }
  document.getElementById('loginBtn').textContent = 'Checking…';
  try{
    const result = await apiPost('login', { username:u, password:p });
    if(result.success){
      localStorage.setItem('tyd_session', JSON.stringify({ username:result.username, role:result.role, name:result.name, ts:Date.now() }));
      window.location.href = result.role === 'boss' ? '/boss.html' : '/employees.html';
    } else {
      errEl.textContent = result.error || 'Login failed';
      errEl.style.display = 'block';
      document.getElementById('loginBtn').textContent = 'Log in';
    }
  }catch(e){
    errEl.textContent = 'Could not reach the server. Check your connection.';
    errEl.style.display = 'block';
    document.getElementById('loginBtn').textContent = 'Log in';
  }
}

// If already logged in, skip straight to the right dashboard
const existing = localStorage.getItem('tyd_session');
if(existing){
  try{
    const s = JSON.parse(existing);
    window.location.href = s.role === 'boss' ? '/boss.html' : '/employees.html';
  }catch(e){ renderForm(); }
} else {
  renderForm();
}
</script>
</body>
</html>
