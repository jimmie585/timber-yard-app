<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timber Yard — Employees</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F6F0E6; --paper:#FBF7EF; --walnut:#2B1B12; --walnut-soft:#4A3626; --oak:#9C6B3E; --oak-light:#C99B63; --oak-pale:#EAD9BE; --forest:#43604B; --forest-pale:#E1EAE0; --rust:#B5482C; --rust-pale:#F3E0D8; --ink-light:#7C6A58; --line:#E3D6C1; --shadow:0 3px 14px rgba(43,27,18,0.09); --radius:12px; }
  *{box-sizing:border-box;} body{margin:0;background:var(--cream);color:var(--walnut);font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;} .mono{font-family:'IBM Plex Mono',monospace;}
  header{background:linear-gradient(135deg,var(--walnut),#3a2415);color:var(--oak-pale);padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,0.15);}
  header .brandrow{display:flex;align-items:center;gap:10px;}
  header .mark{width:32px;height:32px;border-radius:8px;background:repeating-linear-gradient(115deg, var(--oak) 0 4px, var(--oak-light) 4px 8px, var(--oak) 8px 12px);flex-shrink:0;}
  header .name{font-family:'Fraunces',serif;font-size:18px;color:#fff;font-weight:700;line-height:1.2;}
  header .tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--oak-light);}
  .tabs{display:flex;gap:6px;padding:14px 20px 0;max-width:760px;margin:0 auto;flex-wrap:wrap;}
  .tab{padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;background:transparent;color:var(--ink-light);border:1px solid transparent;cursor:pointer;transition:.15s;}
  .tab:hover{background:var(--oak-pale);} .tab.active{background:var(--walnut);color:#fff;}
  main{max-width:760px;margin:0 auto;padding:18px 20px 40px;}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);}
  .panel h3{margin:0 0 14px;font-size:16px;display:flex;align-items:center;gap:8px;}
  label{font-size:12px;font-weight:600;color:var(--ink-light);display:block;margin-bottom:5px;}
  input,select{width:100%;padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--walnut);font-family:inherit;transition:.15s;}
  input:focus,select:focus{outline:none;border-color:var(--oak);box-shadow:0 0 0 3px rgba(156,107,62,0.15);}
  .field{margin-bottom:13px;} .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  button.btn{border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:700;background:var(--walnut);color:var(--paper);cursor:pointer;transition:.15s;}
  button.btn:hover{background:var(--walnut-soft);}
  button.btn.secondary{background:#fff;color:var(--walnut);border:1.5px solid var(--line);}
  button.btn.forest{background:var(--forest);} button.btn.forest:hover{background:#385a41;}
  button.btn.sm{padding:7px 13px;font-size:12.5px;}
  button.btn.full{width:100%;}
  table{width:100%;border-collapse:collapse;font-size:13px;} th{text-align:left;font-size:10.5px;color:var(--ink-light);text-transform:uppercase;letter-spacing:.03em;padding:8px 7px;border-bottom:2px solid var(--line);font-weight:700;} td{padding:9px 7px;border-bottom:1px solid var(--line);}
  .lineitem{display:grid;grid-template-columns:2fr 70px 80px 26px;gap:7px;align-items:end;margin-bottom:9px;}
  .lineitem .rm{background:none;border:none;color:var(--rust);font-size:18px;cursor:pointer;}
  .num{font-family:'IBM Plex Mono',monospace;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
  .badge.paid{background:var(--forest-pale);color:var(--forest);} .badge.partial{background:#FCEFD9;color:#96631A;} .badge.unpaid,.badge.low{background:var(--rust-pale);color:var(--rust);}
  .lowrow{background:var(--rust-pale);} .empty{text-align:center;color:var(--ink-light);padding:26px;font-size:13.5px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--walnut);color:var(--paper);padding:12px 20px;border-radius:9px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:100;white-space:nowrap;}
  .toast.show{opacity:1;}
  .totalsbox{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
  .config-warning{background:var(--rust-pale);color:var(--rust);padding:16px;border-radius:var(--radius);margin:20px;font-size:13.5px;line-height:1.5;}
  .hint{font-size:12px;color:var(--ink-light);margin-top:-2px;margin-bottom:12px;}
</style>
</head>
<body>

<!-- ⚠ PASTE YOUR APPS SCRIPT WEB APP URL BELOW ⚠ -->
<script>const APPS_SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";</script>

<header>
  <div class="brandrow"><div class="mark"></div><div><div class="name">Timber Yard</div><div class="tag" id="roleTag">Employee entry</div></div></div>
  <div style="display:flex;gap:8px;">
    <a id="bossLink" href="/boss.html" style="display:none;text-decoration:none;"><button class="btn sm secondary" style="width:auto;">📊 Boss dashboard</button></a>
    <button class="btn sm secondary" id="refreshBtn" style="width:auto;">↻ Refresh</button>
    <button class="btn sm secondary" id="logoutBtn" style="width:auto;">Log out</button>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
// ---- Session guard ----
const session = (function(){
  try{ return JSON.parse(localStorage.getItem('tyd_session')); }catch(e){ return null; }
})();
if(!session || !session.role){
  window.location.href = '/';
}
document.getElementById('logoutBtn').onclick = ()=>{ localStorage.removeItem('tyd_session'); window.location.href = '/'; };
if(session && session.role === 'boss'){
  document.getElementById('bossLink').style.display = 'inline-block';
  document.getElementById('roleTag').textContent = 'Employee entry · logged in as ' + session.name + ' (boss)';
} else if(session){
  document.getElementById('roleTag').textContent = 'Employee entry · ' + session.name;
}

let data = { stock:[], customers:[], salesSummary:[], salesLines:[], payments:[], movements:[] };
let tab = 'sale';
let saleDraft = { customerName:'', phone:'', email:'', items:[{stockId:'',qty:1,price:0}], paid:0 };

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function money(n){ return 'KES ' + Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0}); }
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function apiGet(){ const res = await fetch(APPS_SCRIPT_URL + '?action=getData'); return res.json(); }
async function apiPost(action, payload){
  const res = await fetch(APPS_SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({action}, payload)) });
  return res.json();
}

async function loadData(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR')===0){
    document.getElementById('main').innerHTML = `<div class="config-warning">Not connected yet. Open this file, find <code>APPS_SCRIPT_URL</code> near the top, and paste in your Apps Script Web App URL.</div>`;
    return;
  }
  try{ data = await apiGet(); render(); }
  catch(e){ document.getElementById('main').innerHTML = `<div class="config-warning">Could not load data. Check the Apps Script URL and that the deployment is set to "Anyone" access.</div>`; }
}

function render(){
  document.getElementById('tabs').innerHTML = ['sale','stock','sales','customers'].map(t=>
    `<button class="tab ${tab===t?'active':''}" data-tab="${t}">${t==='sale'?'🧾 New sale':t==='stock'?'🪵 Stock':t==='sales'?'📋 Sales':'👤 Customers'}</button>`).join('');
  document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab; render();}));
  const main = document.getElementById('main');
  if(tab==='sale') main.innerHTML = renderSale();
  else if(tab==='stock') main.innerHTML = renderStock();
  else if(tab==='sales') main.innerHTML = renderSalesList();
  else main.innerHTML = renderCustomers();
  attach();
}

function renderSale(){
  let total=0;
  saleDraft.items.forEach(li=>{
    const st = data.stock.find(s=>s.ID===li.stockId);
    if(st && !li._touched) li.price = st.Price;
    total += (li.qty||0)*(li.price||0);
  });
  const balance = Math.max(total-(saleDraft.paid||0),0);
  return `
    <div class="panel">
      <h3>👤 Customer</h3>
      <div class="row2">
        <div class="field"><label>Name</label><input id="custName" list="custList" value="${esc(saleDraft.customerName)}" placeholder="e.g. John Mwangi"></div>
        <div class="field"><label>Phone</label><input id="custPhone" value="${esc(saleDraft.phone)}" placeholder="07xx xxx xxx"></div>
      </div>
      <div class="field"><label>Email (optional)</label><input id="custEmail" type="email" value="${esc(saleDraft.email)}" placeholder="customer@email.com"></div>
      <div class="hint">Phone gets an SMS on payment. Email gets a receipt automatically.</div>
      <datalist id="custList">${data.customers.map(c=>`<option value="${esc(c.Name)}">`).join('')}</datalist>
    </div>
    <div class="panel">
      <h3>🪵 Items</h3>
      ${data.stock.length===0 ? `<div class="empty">Add stock items in the Stock tab first.</div>` : `
      ${saleDraft.items.map((li,idx)=>`
        <div class="lineitem">
          <select data-li="${idx}" data-f="stockId">
            <option value="">Select item…</option>
            ${data.stock.map(s=>`<option value="${s.ID}" ${li.stockId===s.ID?'selected':''}>${esc(s.Name)} (${s.Qty} ${esc(s.Unit)})</option>`).join('')}
          </select>
          <input type="number" min="0" step="any" data-li="${idx}" data-f="qty" value="${li.qty}" placeholder="Qty">
          <input type="number" min="0" step="any" data-li="${idx}" data-f="price" value="${li.price}" placeholder="Price">
          <button class="rm" data-rm="${idx}">✕</button>
        </div>`).join('')}
      <button class="btn secondary sm" id="addLine">+ Add item</button>
      <div class="totalsbox">
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:18px;margin-bottom:10px;"><span>Total</span><span class="num">${money(total)}</span></div>
        <div class="field"><label>Amount paid now</label><input type="number" min="0" id="paidNow" value="${saleDraft.paid}"></div>
        <div style="display:flex;justify-content:space-between;font-size:14px;color:${balance>0?'var(--rust)':'var(--forest)'};font-weight:700;"><span>Balance due</span><span class="num">${money(balance)}</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn forest" id="completeSale">Complete sale</button>
        <button class="btn secondary" id="clearSale">Clear</button>
      </div>`}
    </div>
  `;
}

function renderStock(){
  return `
    <div class="panel">
      <h3>➕ Add new stock item</h3>
      <div class="field"><label>Name</label><input id="ni_name" placeholder="e.g. Cypress 2x4x12ft"></div>
      <div class="row2">
        <div class="field"><label>Unit</label><input id="ni_unit" placeholder="pcs / m³"></div>
        <div class="field"><label>Price/unit</label><input id="ni_price" type="number" min="0"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Starting qty</label><input id="ni_qty" type="number" min="0" value="0"></div>
        <div class="field"><label>Low stock alert</label><input id="ni_low" type="number" min="0" value="5"></div>
      </div>
      <button class="btn full" id="addItemBtn">Add item</button>
    </div>
    <div class="panel">
      <h3>📦 Receive stock</h3>
      ${data.stock.length===0 ? `<div class="empty">No items yet.</div>` : `
      <div class="field"><label>Item</label><select id="rc_item">${data.stock.map(s=>`<option value="${s.ID}">${esc(s.Name)}</option>`).join('')}</select></div>
      <div class="field"><label>Qty received</label><input id="rc_qty" type="number" min="0" step="any"></div>
      <div class="field"><label>Note</label><input id="rc_note" placeholder="e.g. Delivery from supplier"></div>
      <button class="btn forest full" id="receiveBtn">Add to stock</button>`}
    </div>
    <div class="panel">
      <h3>📊 Current stock</h3>
      ${data.stock.length===0 ? `<div class="empty">No stock items yet.</div>` : `
      <table><thead><tr><th>Item</th><th>Qty</th><th>Price</th><th></th></tr></thead><tbody>
        ${data.stock.map(s=>`<tr class="${Number(s.Qty)<=Number(s.LowThreshold)?'lowrow':''}"><td>${esc(s.Name)} ${Number(s.Qty)<=Number(s.LowThreshold)?'<span class="badge low">LOW</span>':''}</td><td class="num">${s.Qty} ${esc(s.Unit)}</td><td class="num">${money(s.Price)}</td>
        <td><button class="btn sm secondary" data-adjust="${s.ID}">Adjust</button></td></tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
}

function renderSalesList(){
  const list = [...data.salesSummary].sort((a,b)=>new Date(b.Date)-new Date(a.Date)).slice(0,25);
  return `
    <div class="panel">
      <h3>📋 Recent sales</h3>
      ${list.length===0 ? `<div class="empty">No sales yet.</div>` : `
      <table><thead><tr><th>Receipt</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>
        ${list.map(s=>`<tr><td class="num">#${s.ReceiptNo}</td><td>${esc(s.CustomerName)}</td><td class="num">${money(s.Total)}</td><td><span class="badge ${s.Status}">${s.Status}</span></td>
        <td>${Number(s.Balance)>0?`<button class="btn sm secondary" data-pay="${s.SaleID}">Add payment</button>`:''} <button class="btn sm secondary" data-emailsale="${s.SaleID}" data-receipt="${s.ReceiptNo}">Email</button></td></tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
}

function renderCustomers(){
  return `
    <div class="panel">
      <h3>➕ Add customer</h3>
      <div class="field"><label>Name</label><input id="c_name"></div>
      <div class="row2">
        <div class="field"><label>Phone</label><input id="c_phone"></div>
        <div class="field"><label>Email</label><input id="c_email" type="email"></div>
      </div>
      <button class="btn full" id="addCustBtn">Add customer</button>
    </div>
    <div class="panel">
      <h3>👥 All customers</h3>
      ${data.customers.length===0 ? `<div class="empty">None yet.</div>` : `
      <table><thead><tr><th>Name</th><th>Phone</th><th>Email</th></tr></thead><tbody>
        ${data.customers.map(c=>`<tr><td>${esc(c.Name)}</td><td>${esc(c.Phone)}</td><td>${esc(c.Email)}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
  `;
}

function attach(){
  document.getElementById('refreshBtn').onclick = loadData;

  document.querySelectorAll('[data-li]').forEach(el=>el.addEventListener('input',()=>{
    const idx=Number(el.dataset.li), f=el.dataset.f, li=saleDraft.items[idx];
    if(f==='stockId'){ li.stockId=el.value; li._touched=false; const st=data.stock.find(s=>s.ID===el.value); if(st) li.price=st.Price; }
    else if(f==='qty') li.qty=parseFloat(el.value)||0;
    else if(f==='price'){ li.price=parseFloat(el.value)||0; li._touched=true; }
    render();
  }));
  document.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click',()=>{
    saleDraft.items.splice(Number(el.dataset.rm),1);
    if(saleDraft.items.length===0) saleDraft.items.push({stockId:'',qty:1,price:0});
    render();
  }));
  const addLine = document.getElementById('addLine');
  if(addLine) addLine.onclick = ()=>{ saleDraft.items.push({stockId:'',qty:1,price:0}); render(); };
  const cn = document.getElementById('custName'); if(cn) cn.oninput = e=>saleDraft.customerName=e.target.value;
  const cp = document.getElementById('custPhone'); if(cp) cp.oninput = e=>saleDraft.phone=e.target.value;
  const ce = document.getElementById('custEmail'); if(ce) ce.oninput = e=>saleDraft.email=e.target.value;
  const pn = document.getElementById('paidNow'); if(pn) pn.oninput = e=>{ saleDraft.paid=parseFloat(e.target.value)||0; render(); };
  const clearSale = document.getElementById('clearSale'); if(clearSale) clearSale.onclick = ()=>{ saleDraft={customerName:'',phone:'',email:'',items:[{stockId:'',qty:1,price:0}],paid:0}; render(); };
  const completeSale = document.getElementById('completeSale'); if(completeSale) completeSale.onclick = doCompleteSale;

  const addItemBtn = document.getElementById('addItemBtn');
  if(addItemBtn) addItemBtn.onclick = async ()=>{
    const name = document.getElementById('ni_name').value.trim();
    if(!name){ showToast('Enter a name'); return; }
    data = await apiPost('addStockItem', { name, unit: document.getElementById('ni_unit').value.trim()||'pcs',
      price: document.getElementById('ni_price').value, qty: document.getElementById('ni_qty').value, lowThreshold: document.getElementById('ni_low').value });
    showToast('Item added'); render();
  };
  const receiveBtn = document.getElementById('receiveBtn');
  if(receiveBtn) receiveBtn.onclick = async ()=>{
    const qty = parseFloat(document.getElementById('rc_qty').value)||0;
    if(qty<=0){ showToast('Enter a quantity'); return; }
    data = await apiPost('receiveStock', { stockId: document.getElementById('rc_item').value, qty, note: document.getElementById('rc_note').value });
    showToast('Stock received'); render();
  };
  document.querySelectorAll('[data-adjust]').forEach(el=>el.onclick = async ()=>{
    const item = data.stock.find(s=>s.ID===el.dataset.adjust);
    const qty = prompt('New quantity for '+item.Name, item.Qty);
    if(qty===null) return;
    data = await apiPost('adjustStock', { stockId:item.ID, qty, price:item.Price, lowThreshold:item.LowThreshold, note:'Manual adjustment' });
    showToast('Stock updated'); render();
  });
  document.querySelectorAll('[data-pay]').forEach(el=>el.onclick = async ()=>{
    const amount = prompt('Payment amount received?');
    if(!amount) return;
    data = await apiPost('addPayment', { saleId: el.dataset.pay, amount, method:'Cash' });
    showToast('Payment recorded — SMS sent if phone on file'); render();
  });
  document.querySelectorAll('[data-emailsale]').forEach(el=>el.onclick = async ()=>{
    const email = prompt('Send receipt #'+el.dataset.receipt+' to which email?');
    if(!email) return;
    await apiPost('emailReceipt', { saleId: el.dataset.emailsale, email });
    showToast('Receipt emailed');
  });
  const addCustBtn = document.getElementById('addCustBtn');
  if(addCustBtn) addCustBtn.onclick = async ()=>{
    const name = document.getElementById('c_name').value.trim();
    if(!name){ showToast('Enter a name'); return; }
    data = await apiPost('addCustomer', { name, phone: document.getElementById('c_phone').value.trim(), email: document.getElementById('c_email').value.trim() });
    showToast('Customer added'); render();
  };
}

async function doCompleteSale(){
  const name = saleDraft.customerName.trim();
  if(!name){ showToast('Enter a customer name'); return; }
  const items = saleDraft.items.filter(li=>li.stockId && li.qty>0).map(li=>{
    const st = data.stock.find(s=>s.ID===li.stockId);
    return { stockId: st.ID, name: st.Name, qty: li.qty, price: li.price };
  });
  if(items.length===0){ showToast('Add at least one item'); return; }
  for(const li of items){
    const st = data.stock.find(s=>s.ID===li.stockId);
    if(li.qty > st.Qty){ showToast('Not enough stock: '+st.Name); return; }
  }
  const result = await apiPost('addSale', { customerName:name, phone:saleDraft.phone, email:saleDraft.email, items, paid:saleDraft.paid });
  data = result.data || result;
  showToast('Sale recorded — receipt #' + (result.receiptNo||'') + (result.emailSent ? ' — emailed' : ''));
  saleDraft = { customerName:'', phone:'', email:'', items:[{stockId:'',qty:1,price:0}], paid:0 };
  render();
}

loadData();
</script>
</body>
</html>
